name: Build & Publish Verified Release Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish assets for (e.g. v1.0.5)"
        required: false
        default: "v1.0.5"

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust stable toolchain (with static musl target)
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install Linux packaging tools (rpm)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      - name: Run full workspace test suite
        run: cargo test --workspace --locked

      - name: Build static Linux x86_64 release binary
        env:
          RUSTFLAGS: "-C target-feature=+crt-static --remap-path-prefix=${{ github.workspace }}=/src"
        run: cargo build --release --locked --target x86_64-unknown-linux-musl --bin singularity

      - name: Package Linux distributions (Debian, Ubuntu, Mint, Bazzite)
        run: |
          mkdir -p release-artifacts
          VER="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"
          cp target/x86_64-unknown-linux-musl/release/singularity release-artifacts/singularity-linux-x86_64
          bash scripts/package-linux.sh target/x86_64-unknown-linux-musl/release/singularity "${VER}" release-artifacts
          ls -lh release-artifacts

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-x86_64
          path: release-artifacts/*

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Run workspace tests on Windows
        run: cargo test --workspace --locked

      - name: Build Windows browser and installer
        env:
          RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=/src"
        run: |
          cargo build --release --locked --bin singularity
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target/release/singularity.exe dist/singularity.exe -Force
          cargo build --release --locked --bin Singularity-Setup
          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          Copy-Item target/release/Singularity-Setup.exe release-artifacts/Singularity-setup.exe
          Copy-Item target/release/singularity.exe release-artifacts/singularity.exe

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x86_64
          path: release-artifacts/*

  publish-release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt (and optional Ed25519 signature)
        env:
          SIGNING_KEY_PEM: ${{ secrets.SINGULARITY_RELEASE_SIGNING_KEY }}
        run: |
          cd artifacts
          sha256sum \
            Singularity-setup.exe \
            Singularity-Debian.deb \
            Singularity-Ubuntu.deb \
            Singularity-Bazzite.rpm \
            Singularity-Mint.deb \
            singularity.exe \
            singularity-linux-x86_64 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          if [ -n "${SIGNING_KEY_PEM}" ]; then
            printf '%s\n' "${SIGNING_KEY_PEM}" > /tmp/ed25519_key.pem
            chmod 600 /tmp/ed25519_key.pem
            openssl pkeyutl -sign -inkey /tmp/ed25519_key.pem -rawin -in SHA256SUMS.txt | base64 -w0 > SHA256SUMS.txt.sig
            shred -u /tmp/ed25519_key.pem 2>/dev/null || rm -f /tmp/ed25519_key.pem
            echo "Signed SHA256SUMS.txt with Ed25519."
          fi

      - name: Upload GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TARGET_TAG="${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_TAG}" ]; then
            TARGET_TAG="${INPUT_TAG}"
          else
            TARGET_TAG="v1.0.5"
          fi
          if ! gh release view "${TARGET_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TARGET_TAG}" --repo "${GITHUB_REPOSITORY}" --title "Singularity Browser ${TARGET_TAG}" --generate-notes
          fi
          ASSETS=(
            "artifacts/Singularity-setup.exe#Singularity-setup.exe"
            "artifacts/Singularity-Debian.deb#Singularity.(Debian)"
            "artifacts/Singularity-Ubuntu.deb#Singularity.(Ubuntu)"
            "artifacts/Singularity-Bazzite.rpm#Singularity.(Bazzit)"
            "artifacts/Singularity-Mint.deb#Singularity.(Mint)"
            "artifacts/singularity.exe"
            "artifacts/singularity-linux-x86_64"
            "artifacts/SHA256SUMS.txt"
          )
          if [ -f artifacts/SHA256SUMS.txt.sig ]; then
            ASSETS+=(artifacts/SHA256SUMS.txt.sig)
          fi
          gh release upload "${TARGET_TAG}" --repo "${GITHUB_REPOSITORY}" --clobber "${ASSETS[@]}"
