name: Build & Publish Verified Release Assets

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish assets for (e.g. v2.0.5)"
        required: false
        default: "v2.0.5"
      publish:
        description: "Whether to publish assets to GitHub Releases (set false for CI verification dry-runs)"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust stable toolchain (with static musl target)
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install Linux packaging tools (rpm)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      - name: Run full workspace test suite
        run: cargo test --workspace --locked

      - name: Build static Linux x86_64 release binary
        env:
          RUSTFLAGS: "-C target-feature=+crt-static --remap-path-prefix=${{ github.workspace }}=/src"
        run: cargo build --release --locked --target x86_64-unknown-linux-musl --bin singularity

      - name: Package Linux distributions (Debian, Ubuntu, Mint, Bazzite)
        run: |
          mkdir -p release-artifacts
          VER="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')"
          cp target/x86_64-unknown-linux-musl/release/singularity release-artifacts/singularity-linux-x86_64
          bash scripts/package-linux.sh target/x86_64-unknown-linux-musl/release/singularity "${VER}" release-artifacts
          ls -lh release-artifacts

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-x86_64
          path: release-artifacts/*

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      - name: Cache Pure Chromium (CEF 150 / OBS 7871 with proprietary H.264/AAC) SDK
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.local/share/cef
          key: cef-win64-obs-7871-54cd191a

      - name: Configure CEF_PATH, stage proprietary-codec CEF 150 SDK, and setup Ninja
        shell: pwsh
        run: |
          $cefPath = Join-Path $env:USERPROFILE ".local\share\cef"
          "CEF_PATH=$cefPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Prevent silent fallback to Spotify's non-H.264 CDN if CEF_PATH validation ever fails.
          "CEF_DOWNLOAD_URL=http://127.0.0.1:1/forbidden-spotify-fallback" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "CEF_PATH=$cefPath"
          python scripts/prepare-cef-win64.py $cefPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            $vsNinja = Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter "ninja.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($vsNinja) {
              $vsNinja.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              Write-Host "Added Visual Studio Ninja to PATH: $($vsNinja.DirectoryName)"
            } else {
              choco install ninja --no-progress -y
            }
          }
          cmake --version

      - name: Run workspace tests on Windows
        run: cargo test --workspace --locked

      - name: Build Pure Chromium (CEF) Windows browser and self-contained installer
        shell: pwsh
        env:
          RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=/src"
        run: |
          cargo build --release --locked --bin singularity
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python scripts/package-windows-cef.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Copy-Item target\release\singularity.exe dist\singularity.exe -Force

          cargo build --release --locked --bin Singularity-Setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          New-Item -ItemType Directory -Force -Path release-artifacts | Out-Null
          python scripts/package-windows-cef.py --attach-sfx target\release\Singularity-Setup.exe dist\singularity-bundle.zip release-artifacts\Singularity-setup.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          & release-artifacts\Singularity-setup.exe --verify-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          # Smoke-test real Windows silent SFX extraction of Pure Chromium CEF runtime
          $smokeDir = Join-Path $env:RUNNER_TEMP "singularity-smoke-install"
          Remove-Item -Recurse -Force $smokeDir -ErrorAction SilentlyContinue
          $pInstall = Start-Process -FilePath "release-artifacts\Singularity-setup.exe" -ArgumentList "--silent", "--dir", $smokeDir -Wait -PassThru
          if ($pInstall.ExitCode -ne 0) {
            Write-Error "Smoke install exited with code $($pInstall.ExitCode)"
            exit 1
          }
          foreach ($f in @("singularity.exe", "libcef.dll", "icudtl.dat", "resources.pak", "locales\en-US.pak", "locales\fr.pak")) {
            $p = Join-Path $smokeDir $f
            if (-not (Test-Path $p)) {
              Write-Error "Smoke install missing required file: $p"
              exit 1
            }
          }
          Write-Host "[OK] Silent SFX extraction verified all Pure Chromium CEF runtime files"

          # End-to-end REAL Pure Chromium (CEF) launch, V8 IPC, H.264/AAC/MSE codecs, DOM/rAF, pixel & clean-shutdown smoke test!
          $smokeLog = Join-Path $env:RUNNER_TEMP "singularity-cef-smoke.log"
          $smokeCefLog = Join-Path $env:RUNNER_TEMP "singularity-cef-runtime.log"
          $smokeProf = Join-Path $env:RUNNER_TEMP "singularity-cef-profile"
          Remove-Item -Force $smokeLog, $smokeCefLog -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $smokeProf -ErrorAction SilentlyContinue
          $pLaunch = Start-Process -FilePath (Join-Path $smokeDir "singularity.exe") `
            -ArgumentList "--smoke-test-cef", "--smoke-log", $smokeLog, "--smoke-cef-log", $smokeCefLog, "--smoke-profile", $smokeProf `
            -WorkingDirectory $env:RUNNER_TEMP -PassThru
          if (-not $pLaunch.WaitForExit(60000)) {
            Write-Host "=== CEF Smoke Test Timed Out After 60s — Killing Process ==="
            try { $pLaunch.Kill($true) } catch {}
            if (Test-Path $smokeLog) { Get-Content $smokeLog }
            if (Test-Path $smokeCefLog) { Get-Content $smokeCefLog | Select-Object -Last 120 }
            Write-Error "Real CEF UI launch smoke test TIMED OUT after 60s"
            exit 1
          }
          Write-Host "=== CEF Smoke Test Log ==="
          if (Test-Path $smokeLog) { Get-Content $smokeLog } else { Write-Host "(no smoke log written)" }
          if ($pLaunch.ExitCode -ne 0) {
            Write-Host "=== CEF Runtime Log ==="
            if (Test-Path $smokeCefLog) { Get-Content $smokeCefLog | Select-Object -Last 120 } else { Write-Host "(no cef log written)" }
            Write-Error "Real CEF UI launch smoke test FAILED with exit code $($pLaunch.ExitCode)"
            exit 1
          }
          if (Test-Path (Join-Path $smokeProf "running.lock")) {
            Write-Error "Clean shutdown check FAILED: running.lock was left behind in $smokeProf!"
            exit 1
          }
          if (Test-Path (Join-Path $smokeProf "crashes\last_crash.json")) {
            Write-Error "Clean shutdown check FAILED: unexpected crash report written during smoke test!"
            exit 1
          }
          Write-Host "[OK] Real Windows Pure Chromium (CEF) UI launch, H.264/AAC/MSE codecs, V8 IPC, DOM/rAF, pixel & clean-shutdown check PASSED!"
          Remove-Item -Recurse -Force $smokeDir, $smokeProf -ErrorAction SilentlyContinue
          Remove-Item -Force $smokeLog, $smokeCefLog -ErrorAction SilentlyContinue

          # Smoke-test /DELAYLOAD:libcef.dll: running singularity.exe ALONE (no libcef.dll!) must NOT fail with OS DLL error
          $isoDir = Join-Path $env:RUNNER_TEMP "singularity-no-cef-test"
          Remove-Item -Recurse -Force $isoDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $isoDir | Out-Null
          Copy-Item target\release\singularity.exe (Join-Path $isoDir "singularity.exe") -Force
          $pIso = Start-Process -FilePath (Join-Path $isoDir "singularity.exe") -ArgumentList "--version" -Wait -PassThru
          if ($pIso.ExitCode -ne 0) {
            Write-Error "Isolated singularity.exe --version exited with code $($pIso.ExitCode) (delay-load libcef.dll broken!)"
            exit 1
          }
          Write-Host "[OK] /DELAYLOAD:libcef.dll verified cleanly without libcef.dll (exit code 0)"
          Remove-Item -Recurse -Force $isoDir -ErrorAction SilentlyContinue

          Copy-Item target\release\singularity.exe release-artifacts\singularity.exe -Force
          Get-ChildItem release-artifacts | Format-Table Name, @{N='MB';E={[math]::Round($_.Length/1MB,2)}}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x86_64
          path: release-artifacts/*

  publish-release:
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256SUMS.txt (and optional Ed25519 signature)
        env:
          SIGNING_KEY_PEM: ${{ secrets.SINGULARITY_RELEASE_SIGNING_KEY }}
        run: |
          cd artifacts
          sha256sum \
            Singularity-setup.exe \
            Singularity-Debian.deb \
            Singularity-Ubuntu.deb \
            Singularity-Bazzite.rpm \
            Singularity-Mint.deb \
            singularity.exe \
            singularity-linux-x86_64 > SHA256SUMS.txt
          cat SHA256SUMS.txt
          if [ -n "${SIGNING_KEY_PEM}" ]; then
            printf '%s\n' "${SIGNING_KEY_PEM}" > /tmp/ed25519_key.pem
            chmod 600 /tmp/ed25519_key.pem
            openssl pkeyutl -sign -inkey /tmp/ed25519_key.pem -rawin -in SHA256SUMS.txt | base64 -w0 > SHA256SUMS.txt.sig
            shred -u /tmp/ed25519_key.pem 2>/dev/null || rm -f /tmp/ed25519_key.pem
            echo "Signed SHA256SUMS.txt with Ed25519."
          fi

      - name: Upload GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TARGET_TAG="${GITHUB_REF_NAME}"
          elif [ -n "${INPUT_TAG}" ]; then
            TARGET_TAG="${INPUT_TAG}"
          else
            TARGET_TAG="v2.0.5"
          fi
          if ! gh release view "${TARGET_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TARGET_TAG}" --repo "${GITHUB_REPOSITORY}" --title "Singularity Browser ${TARGET_TAG}" --generate-notes
          fi
          ASSETS=(
            "artifacts/Singularity-setup.exe#Singularity-setup.exe"
            "artifacts/Singularity-Debian.deb#Singularity.(Debian)"
            "artifacts/Singularity-Ubuntu.deb#Singularity.(Ubuntu)"
            "artifacts/Singularity-Bazzite.rpm#Singularity.(Bazzit)"
            "artifacts/Singularity-Mint.deb#Singularity.(Mint)"
            "artifacts/singularity.exe"
            "artifacts/singularity-linux-x86_64"
            "artifacts/SHA256SUMS.txt"
          )
          if [ -f artifacts/SHA256SUMS.txt.sig ]; then
            ASSETS+=(artifacts/SHA256SUMS.txt.sig)
          fi
          gh release upload "${TARGET_TAG}" --repo "${GITHUB_REPOSITORY}" --clobber "${ASSETS[@]}"
