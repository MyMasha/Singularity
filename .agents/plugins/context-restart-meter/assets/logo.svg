<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <rect x="14" y="14" width="100" height="100" rx="24" fill="#18181B" stroke="#3F3F46" stroke-width="3"/>
  <!-- Gauge background arc -->
  <path d="M 32 82 A 36 36 0 1 1 96 82" stroke="#27272A" stroke-width="10" stroke-linecap="round"/>
  <!-- Green zone (0-50%) -->
  <path d="M 32 82 A 36 36 0 0 1 64 28" stroke="#22C55E" stroke-width="10" stroke-linecap="round"/>
  <!-- Amber zone (50-80%) -->
  <path d="M 64 28 A 36 36 0 0 1 92 48" stroke="#F59E0B" stroke-width="10" stroke-linecap="round"/>
  <!-- Red zone (80-100%) -->
  <path d="M 92 48 A 36 36 0 0 1 96 82" stroke="#EF4444" stroke-width="10" stroke-linecap="round"/>
  <!-- Needle pointing toward ~80% -->
  <line x1="64" y1="68" x2="86" y2="48" stroke="#FAFAFA" stroke-width="5" stroke-linecap="round"/>
  <circle cx="64" cy="68" r="6" fill="#FAFAFA"/>
  <!-- Percentage label -->
  <text x="64" y="99" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#FAFAFA">%</text>
</svg>
